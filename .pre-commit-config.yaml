repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        language: fail
        entry: ".env files hold secrets; keep them out of git (only .env.example is allowed)"
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
      - id: forbid-key-files
        name: forbid committing key and certificate files
        language: fail
        entry: "Key and credential files must not be committed"
        files: '\.(pem|key|p12|pfx|jks|keystore|ppk)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|(^|/)(credentials|service[-_]account)[^/]*\.json$'
      - id: gitleaks-pre-push
        name: gitleaks scan of commits being pushed
        language: system
        entry: gitleaks git --no-banner --redact --log-opts=--all
        pass_filenames: false
        always_run: true
        stages: [pre-push]
