<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                 style="background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="font-size:20px;margin:0 0 16px;">$title</h1>
                <p style="font-size:15px;line-height:22px;margin:0 0 24px;white-space:pre-line;">$body</p>
                <p style="margin:0 0 24px;">
                  <a href="$link"
                     style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;
                            padding:12px 20px;border-radius:8px;font-size:15px;">Open in $brand_name</a>
                </p>
                <p style="font-size:13px;line-height:20px;color:#6b7280;margin:0;">
                  You get this email because email notifications are on for this event.
                  <a href="$settings_link" style="color:#6b7280;">Change what we email you</a>.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
