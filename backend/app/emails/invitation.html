<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                 style="background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="font-size:20px;margin:0 0 16px;">Join $organization_name on $brand_name</h1>
                <p style="font-size:15px;line-height:22px;margin:0 0 24px;">
                  $inviter_name invited you to join <strong>$organization_name</strong>.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="$link"
                     style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;
                            padding:12px 20px;border-radius:8px;font-size:15px;">Accept invitation</a>
                </p>
                <p style="font-size:13px;line-height:20px;color:#6b7280;margin:0;">
                  The link is valid for 7 days. If the button does not work, open this address:<br>
                  <a href="$link" style="color:#6b7280;">$link</a>
                </p>
                <p style="font-size:13px;line-height:20px;color:#6b7280;margin:16px 0 0;">
                  If you did not expect this invitation, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
