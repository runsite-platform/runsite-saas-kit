[project]
name = "runsite-saas-kit"
version = "0.1.0"
description = "Open-source SaaS starter kit for Runsite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17,<2",
    "asyncpg>=0.30,<1",
    "bcrypt>=4.2,<6",
    "boto3>=1.40,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.120,<1",
    "fastapi-filter>=3.0.0",
    "fastapi-pagination>=0.16.1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-jose[cryptography]>=3.5,<4",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.44,<2.2",
    "stripe>=16,<17",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "respx>=0.23,<1",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["UP046", "UP047", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
